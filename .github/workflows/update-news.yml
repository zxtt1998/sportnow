name: Update RSS and publish SportNow
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sportnow-pages-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/argos/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache/argos/cache
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_INTER_THREADS: "1"
      ARGOS_INTRA_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-news.txt
      - name: Install locked RSS runtime independently of translation
        run: python -m pip install -r requirements-news.txt
      - name: Restore translation result cache
        uses: actions/cache@v4
        with:
          path: .cache/translation-cache.json
          key: news-translation-${{ hashFiles('config/translation.json', 'config/glossary.json') }}-${{ github.run_id }}
          restore-keys: |
            news-translation-${{ hashFiles('config/translation.json', 'config/glossary.json') }}-
      - name: Prepare cached Argos model and dependencies
        id: argos
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/argos-setup
      - name: Verify offline model without publisher text
        if: steps.argos.outcome == 'success'
        continue-on-error: true
        run: timeout 180s python -m scripts.news.test_argos --report /tmp/argos-smoke-report.json
      - name: Fetch allowed RSS data, merge history and translate within permissions
        run: timeout 720s python -m scripts.news.pipeline --report /tmp/news-run-report.json
      - name: Validate production data
        run: python -m scripts.news.validate
      - name: Commit only changed data, never overwrite a newer main
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during aggregation; refusing stale data commit."
            exit 1
          fi
          if git diff --quiet -- public/data/news.json public/data/sources-status.json; then
            echo "News and source state are unchanged; no commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/news.json public/data/sources-status.json
            git commit -m 'Update permitted news and source health'
            git push origin HEAD:main
          fi
      - name: Keep execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-update-evidence
          path: |
            /tmp/news-run-report.json
            /tmp/argos-model-report.json
            /tmp/argos-smoke-report.json
          if-no-files-found: ignore
  publish:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
