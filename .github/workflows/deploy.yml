name: Build and deploy SportNow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sportnow-pages-main
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
