name: Prepare pinned Argos offline runtime
description: CPU-only Python dependencies and a versioned English-Chinese model cache
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements-translation.txt
          requirements-news.txt
    - name: Install CPU PyTorch and locked Python dependencies
      shell: bash
      run: |
        python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0'
        python -m pip install -r requirements-translation.txt
    - name: Restore only pinned Argos model cache
      uses: actions/cache@v4
      with:
        path: .cache/argos
        key: argos-${{ runner.os }}-py312-${{ hashFiles('requirements-translation.txt', 'config/translation.json') }}
    - name: Prepare English-Chinese model
      shell: bash
      env:
        XDG_DATA_HOME: ${{ github.workspace }}/.cache/argos/data
        XDG_CACHE_HOME: ${{ github.workspace }}/.cache/argos/cache
      run: timeout 300s python -m scripts.news.prepare_model --strict --report /tmp/argos-model-report.json
